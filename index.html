<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היטסטר - Spotify Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap');
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .spotify-green { background-color: #1DB954; }
        .spotify-green:hover { background-color: #1ed760; }
        select option { background: #1e293b; color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-md pointer-events-none"></div>

    <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 text-center sticky top-0 z-50 shadow-md">
        <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-200">
            <i class="fa-solid fa-gamepad mr-2 text-green-400"></i> HITSTER REMOTE
        </h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-md flex flex-col items-center justify-center">

        <!-- STEP 1: Login Screen -->
        <section id="login-screen" class="w-full hidden bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-6">
            <div class="space-y-2">
                <div class="w-20 h-20 bg-green-500/10 text-green-400 rounded-full flex items-center justify-center mx-auto text-4xl mb-4">
                    <i class="fa-brands fa-spotify"></i>
                </div>
                <h2 class="text-2xl font-bold">ברוכים הבאים!</h2>
                <p class="text-sm text-slate-400">התחבר לחשבון הספוטיפיי שלך כדי לשלוט בשירים בטלפון.</p>
            </div>
            <button id="btn-login-spotify" class="w-full spotify-green text-slate-950 font-bold py-4 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-bolt"></i> התחבר ל-Spotify
            </button>
        </section>

        <!-- STEP 2: Choose Playlist Screen -->
        <section id="setup-screen" class="w-full hidden bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-6">
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-green-400">בחר פלייליסט למשחק</h2>
                <p class="text-xs text-slate-400">בחר פלייליסט מהחשבון שלך או הדבק קישור:</p>
            </div>

            <div class="space-y-4">
                <select id="playlist-dropdown" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 text-right appearance-none">
                    <option value="">טוען את הפלייליסטים שלך...</option>
                </select>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-500 text-xs">או</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>

                <input type="text" id="custom-playlist-input" placeholder="הדבק קישור לפלייליסט אישי..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 dir-ltr text-center font-mono">
            </div>

            <button id="btn-start-game" class="w-full spotify-green text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> התחל לשחק!
            </button>
            
            <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 underline mt-4 font-bold">
                <i class="fa-solid fa-rotate"></i> התנתק ורענן הרשאות מחדש
            </button>
        </section>

        <!-- STEP 3: Game Screen -->
        <section id="game-screen" class="w-full hidden flex-col items-center space-y-6">
            <div class="w-full flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 shadow-md">
                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-300">ניקוד:</span>
                    <span id="score-count" class="font-bold text-xl text-white">0</span>
                </div>
                <button id="btn-change-playlist" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 px-3 rounded-lg transition shadow-lg">
                    חזור לבחירה
                </button>
            </div>
            <div id="game-content" class="text-center text-slate-300 text-sm bg-slate-800/90 p-6 rounded-2xl border border-slate-700 w-full">
                <i class="fa-solid fa-circle-check text-green-400 text-3xl mb-2"></i>
                <p class="font-bold text-white text-base">הפלייליסט הוטען בהצלחה!</p>
                <p class="text-xs text-slate-400 mt-1">השירים מוכנים לשימוש במשחק.</p>
            </div>
        </section>

    </main>

    <script>
        const CLIENT_ID = 'bc721809b5344694abc164c34249aea1';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        let accessToken = localStorage.getItem('spotify_token') || null;

        function showMessage(message, type = 'error', duration = 8000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600 border-red-700' : 'bg-green-600 border-green-700';
            
            toast.className = `${bgColor} border text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2 transition-all duration-300`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        function switchScreen(screenId) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        };

        // --- Authentication Init ---
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const codeVerifier = localStorage.getItem('code_verifier');
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            client_id: CLIENT_ID,
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: REDIRECT_URI,
                            code_verifier: codeVerifier,
                        }),
                    });

                    const data = await response.json();
                    if (data.access_token) {
                        accessToken = data.access_token;
                        localStorage.setItem('spotify_token', accessToken);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        loadSetupScreen();
                    } else {
                        switchScreen('login-screen');
                    }
                } catch (error) {
                    switchScreen('login-screen');
                }
            } else if (accessToken) {
                loadSetupScreen();
            } else {
                switchScreen('login-screen');
            }
        });

        document.getElementById('btn-login-spotify').addEventListener('click', async () => {
            localStorage.clear();
            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const scopes = [
                'playlist-read-private', 
                'playlist-read-collaborative', 
                'user-read-playback-state', 
                'user-modify-playback-state',
                'user-read-private',
                'user-read-email'
            ];
            
            const authUrl = new URL("https://accounts.spotify.com/authorize");
            authUrl.search = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: scopes.join(' '),
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: REDIRECT_URI,
                show_dialog: 'true'
            }).toString();
            
            window.location.href = authUrl.toString();
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = REDIRECT_URI;
        });

        document.getElementById('btn-change-playlist')?.addEventListener('click', () => {
            loadSetupScreen();
        });

        // --- Fetch User Playlists ---
        async function loadSetupScreen() {
            switchScreen('setup-screen');
            const dropdown = document.getElementById('playlist-dropdown');
            
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.status === 401) {
                    localStorage.clear();
                    window.location.reload();
                    return;
                }

                const data = await response.json();
                
                dropdown.innerHTML = '<option value="">-- בחר פלייליסט מהרשימה --</option>';
                if (data.items && data.items.length > 0) {
                    data.items.forEach(playlist => {
                        if (!playlist || !playlist.id) return;
                        const totalTracks = playlist.tracks?.total ?? playlist.items?.total ?? 0;
                        const opt = document.createElement('option');
                        opt.value = playlist.id;
                        opt.textContent = `${playlist.name} (${totalTracks} שירים)`;
                        dropdown.appendChild(opt);
                    });
                } else {
                    dropdown.innerHTML = '<option value="">לא נמצאו פלייליסטים</option>';
                }
            } catch (err) {
                dropdown.innerHTML = '<option value="">שגיאה בטעינת הרשימה</option>';
            }
        }

        // --- Start Game Logic with Updated Spotify API Endpoint ---
        document.getElementById('btn-start-game').addEventListener('click', async () => {
            const dropdownVal = document.getElementById('playlist-dropdown').value;
            const customVal = document.getElementById('custom-playlist-input').value.trim();
            
            let playlistId = null;

            if (customVal !== "") {
                const match = customVal.match(/(?:playlist\/|playlist:)([a-zA-Z0-9]{22})/);
                playlistId = match ? match[1] : (/^[a-zA-Z0-9]{22}$/.test(customVal) ? customVal : null);
            } else if (dropdownVal !== "") {
                playlistId = dropdownVal;
            }

            if (!playlistId) {
                showMessage('אנא בחר פלייליסט תקין מהרשימה או הזן קישור תקין', 'error');
                return;
            }

            fetchPlaylistTracks(playlistId);
        });

        async function fetchPlaylistTracks(playlistId) {
            try {
                // Updated Endpoint: /v1/playlists/{id}/items
                const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/items?limit=100`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                const data = await response.json();

                if (!response.ok) {
                    const apiErrorMsg = data.error?.message || `HTTP ${response.status}`;
                    throw new Error(`Spotify API Error (${response.status}): ${apiErrorMsg}`);
                }

                const items = data.items || [];
                const validTracks = items.filter(item => item && item.track);

                if (validTracks.length === 0) {
                    showMessage('הפלייליסט שנבחר ריק! אנא בחר פלייליסט שמכיל שירים.', 'error');
                    return;
                }

                showMessage(`הפלייליסט נטען בהצלחה! נמצאו ${validTracks.length} שירים.`, 'success');
                switchScreen('game-screen');

            } catch (err) {
                showMessage(err.message, 'error', 10000);
            }
        }
    </script>
</body>
</html>
