<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היטסטר אישי - Pure Web Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- הוספנו גרסה כדי למנוע קאש -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap');
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .spotify-green { background-color: #1DB954; }
        .spotify-green:hover { background-color: #1ed760; }
        .card-flip { perspective: 1000px; }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        select option { background: #1e293b; color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 text-center sticky top-0 z-50 shadow-md">
        <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-200">
            <i class="fa-solid fa-record-vinyl mr-2 text-green-400"></i> HITSTER WEB
        </h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-md flex flex-col items-center justify-center">

        <!-- STEP 1: Login Screen -->
        <section id="login-screen" class="w-full hidden bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-6">
            <div class="space-y-2">
                <div class="w-20 h-20 bg-green-500/10 text-green-400 rounded-full flex items-center justify-center mx-auto text-4xl mb-4">
                    <i class="fa-brands fa-spotify"></i>
                </div>
                <h2 class="text-2xl font-bold">ברוכים הבאים!</h2>
                <p class="text-sm text-slate-400">התחבר לחשבון הספוטיפיי שלך כדי להתחיל (לא חובה Premium).</p>
            </div>
            <button id="btn-login-spotify" class="w-full spotify-green text-slate-950 font-bold py-4 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-bolt"></i> התחבר ל-Spotify
            </button>
        </section>

        <!-- STEP 2: Choose Playlist Screen -->
        <section id="setup-screen" class="w-full hidden bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-6">
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-green-400">בחר פלייליסט למשחק</h2>
                <p class="text-xs text-slate-400">בחר פלייליסט מהחשבון שלך או הדבק קישור:</p>
            </div>

            <div class="space-y-4">
                <select id="playlist-dropdown" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 text-right appearance-none">
                    <option value="">טוען את הפלייליסטים שלך...</option>
                </select>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-500 text-xs">או</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>

                <input type="text" id="custom-playlist-input" placeholder="הדבק קישור לפלייליסט בספוטיפיי..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 dir-ltr text-center font-mono">
            </div>

            <button id="btn-start-game" class="w-full spotify-green text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> התחל לשחק!
            </button>
            
            <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 underline mt-4">
                <i class="fa-solid fa-right-from-bracket"></i> התנתק והתחל מחדש (מומלץ)
            </button>
        </section>

        <!-- STEP 3: Game Screen -->
        <section id="game-screen" class="w-full hidden flex-col items-center space-y-6">

            <div class="w-full flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 shadow-md">
                <div class="flex items-center gap-2">
                    <div class="bg-yellow-500/20 w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-trophy text-yellow-400 text-sm"></i>
                    </div>
                    <span class="text-sm text-slate-300">ניקוד:</span>
                    <span id="score-count" class="font-bold text-xl text-white">0</span>
                </div>
                <div class="flex gap-2">
                    <button id="btn-change-playlist" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 px-3 rounded-lg transition shadow-lg">
                        <i class="fa-solid fa-list"></i>
                    </button>
                    <button id="next-track-btn" class="bg-indigo-600 hover:bg-indigo-500 text-sm font-bold py-2 px-4 rounded-lg transition shadow-lg flex items-center gap-2">
                        הבא <i class="fa-solid fa-forward"></i>
                    </button>
                </div>
            </div>

            <div id="music-card" class="card-flip w-full h-80 cursor-pointer w-full max-w-sm mx-auto">
                <div class="card-inner relative w-full h-full rounded-3xl shadow-2xl border border-slate-700">
                    
                    <div class="card-front absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-indigo-500/30">
                        <div class="w-full flex justify-between text-slate-400 text-sm font-medium">
                            <span><i class="fa-solid fa-music mr-1"></i> כרטיס חידה</span>
                            <i class="fa-solid fa-question-circle text-indigo-400"></i>
                        </div>

                        <div class="flex flex-col items-center space-y-4 my-auto">
                            <button id="play-pause-btn" class="w-24 h-24 spotify-green text-slate-950 rounded-full flex items-center justify-center text-4xl shadow-[0_0_30px_rgba(29,185,84,0.3)] hover:scale-105 active:scale-95 transition">
                                <i class="fa-solid fa-play ml-2" id="play-icon"></i>
                            </button>
                            <span class="text-sm text-slate-400 font-medium tracking-wide">לחץ לשמיעת קטע מהשיר</span>
                        </div>

                        <button id="reveal-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition text-base flex items-center justify-center gap-2 shadow-lg border border-slate-600">
                            <i class="fa-solid fa-eye"></i> חשוף תשובה
                        </button>
                    </div>

                    <div class="card-back absolute inset-0 bg-slate-900 rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-green-500 shadow-[0_0_30px_rgba(29,185,84,0.1)]">
                        <div id="album-cover" class="w-32 h-32 bg-slate-800 rounded-2xl shadow-xl bg-cover bg-center mb-2 border border-slate-700"></div>

                        <div class="text-center space-y-1 w-full">
                            <div id="track-year" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300 drop-shadow-sm">
                                ----
                            </div>
                            <div id="track-title" class="font-bold text-xl text-white truncate w-full px-2 mt-2">
                                שם השיר
                            </div>
                            <div id="track-artist" class="text-base text-slate-400 truncate w-full px-2">
                                שם האמן
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 w-full mt-4">
                            <button id="btn-wrong" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-3 rounded-xl text-sm border border-red-500/30 transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-xmark"></i> טעות
                            </button>
                            <button id="btn-correct" class="bg-green-500/10 hover:bg-green-500/20 text-green-400 font-bold py-3 rounded-xl text-sm border border-green-500/30 transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-check"></i> צודק (+1)
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-md z-10 flex flex-col items-center justify-center rounded-xl p-6 text-center space-y-4">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-green-500 mb-2"></i>
                <p class="text-white font-medium text-base leading-relaxed" id="loading-text">טוען שירים...</p>
            </div>

        </section>

    </main>

    <script>
        // --- UI Helper Functions ---
        function showMessage(message, type = 'error', duration = 4500) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500/90 border-red-600' : 'bg-green-500/90 border-green-600';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
            
            toast.className = `${bgColor} border backdrop-blur text-white px-5 py-4 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-[-20px] opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function switchScreen(screenId) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            
            const target = document.getElementById(screenId);
            target.classList.remove('hidden');
            if (screenId === 'game-screen') target.classList.add('flex');
        }

        // --- Configuration & State ---
        const CLIENT_ID = 'bc721809b5344694abc164c34249aea1';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        let accessToken = localStorage.getItem('spotify_token') || null;
        let tracks = [];
        let currentTrack = null;
        let score = 0;
        let isPlaying = false;
        
        // Pure Web HTML5 Audio Player
        const audioPlayer = new Audio();
        audioPlayer.onended = () => {
            isPlaying = false;
            document.getElementById('play-icon').className = 'fa-solid fa-play ml-2';
        };

        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        };

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const codeVerifier = localStorage.getItem('code_verifier');
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            client_id: CLIENT_ID,
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: REDIRECT_URI,
                            code_verifier: codeVerifier,
                        }),
                    });

                    const data = await response.json();
                    if (data.access_token) {
                        accessToken = data.access_token;
                        localStorage.setItem('spotify_token', accessToken);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        loadSetupScreen();
                    } else {
                        switchScreen('login-screen');
                    }
                } catch (error) {
                    switchScreen('login-screen');
                }
            } else if (accessToken) {
                loadSetupScreen();
            } else {
                switchScreen('login-screen');
            }
        });

        document.getElementById('btn-login-spotify').addEventListener('click', async () => {
            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const scopes = ['playlist-read-private', 'playlist-read-collaborative'];
            
            const authUrl = new URL("https://accounts.spotify.com/authorize");
            authUrl.search = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: scopes.join(' '),
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: REDIRECT_URI,
            }).toString();
            
            window.location.href = authUrl.toString();
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('spotify_token');
            localStorage.clear();
            window.location.href = REDIRECT_URI;
        });

        // --- Fetch Playlists ---
        async function loadSetupScreen() {
            switchScreen('setup-screen');
            const dropdown = document.getElementById('playlist-dropdown');
            
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                if (response.status === 401) {
                    // Token expired!
                    localStorage.removeItem('spotify_token');
                    window.location.reload();
                    return;
                }

                const data = await response.json();
                
                dropdown.innerHTML = '<option value="">-- בחר פלייליסט מהרשימה --</option>';
                if (data.items && data.items.length > 0) {
                    data.items.forEach(playlist => {
                        if (!playlist) return;
                        const pid = playlist.id || (playlist.uri ? playlist.uri.split(':').pop() : null);
                        if (!pid) return;

                        let countText = '';
                        if (playlist.tracks && playlist.tracks.total != null) {
                            countText = ` (${playlist.tracks.total} שירים)`;
                        }

                        const opt = document.createElement('option');
                        opt.value = pid;
                        opt.textContent = `${playlist.name}${countText}`;
                        dropdown.appendChild(opt);
                    });
                } else {
                    dropdown.innerHTML = '<option value="">לא נמצאו פלייליסטים, הדבק קישור למטה</option>';
                }
            } catch (err) {
                dropdown.innerHTML = '<option value="">שגיאה בטעינת רשימה. הדבק קישור למטה.</option>';
            }
        }

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            const dropdownVal = document.getElementById('playlist-dropdown').value;
            const customVal = document.getElementById('custom-playlist-input').value.trim();
            
            let finalPlaylistId = null;

            if (customVal) {
                try {
                    const urlObj = new URL(customVal);
                    const pathParts = urlObj.pathname.split('/');
                    const playlistIndex = pathParts.indexOf('playlist');
                    if (playlistIndex !== -1 && pathParts.length > playlistIndex + 1) {
                        finalPlaylistId = pathParts[playlistIndex + 1].split('?')[0];
                    }
                } catch (e) {
                    const match = customVal.match(/playlist\/([a-zA-Z0-9]+)/);
                    if (match) finalPlaylistId = match[1];
                }
                if (!finalPlaylistId) {
                    showMessage('שגיאה: הקישור לא תקין. ודא שזה קישור לפלייליסט בספוטיפיי.', 'error');
                    return;
                }
            } else if (dropdownVal) {
                finalPlaylistId = dropdownVal;
            } else {
                showMessage('אנא בחר פלייליסט או הדבק קישור', 'error');
                return;
            }

            initGame(finalPlaylistId);
        });

        // --- Game Logic ---
        async function initGame(playlistId) {
            if (!playlistId || playlistId === 'undefined') {
                showMessage('מזהה פלייליסט שגוי.', 'error');
                return;
            }

            switchScreen('game-screen');
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden');
            
            const tracksLoaded = await fetchPlaylistTracks(playlistId);
            if (!tracksLoaded) {
                switchScreen('setup-screen');
                return;
            }

            overlay.classList.add('hidden');
            loadNextTrack();
            showMessage('המשחק מוכן!', 'success');
        }

        async function fetchPlaylistTracks(playlistId) {
            try {
                const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=100`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                if (!response.ok) {
                    // כאן אנחנו תופסים את השגיאה האמיתית מספוטיפיי ומדפיסים אותה
                    const errData = await response.json().catch(() => ({}));
                    const exactError = errData.error ? errData.error.message : response.statusText;
                    throw new Error(`ספוטיפיי חסמה את הבקשה. קוד: ${response.status}. סיבה: ${exactError}`);
                }

                const data = await response.json();
                const rawItems = data.items || [];

                tracks = rawItems
                    .filter(item => item?.track?.album?.release_date && item.track.preview_url && !item.track.is_local)
                    .map(item => ({
                        preview_url: item.track.preview_url,
                        title: item.track.name,
                        artist: item.track.artists ? item.track.artists.map(a => a.name).join(', ') : 'אמן לא ידוע',
                        year: item.track.album.release_date.substring(0, 4),
                        cover: item.track.album.images?.[0]?.url || ''
                    }));

                tracks.sort(() => Math.random() - 0.5);
                
                if (tracks.length === 0) {
                    showMessage('שגיאה: לספוטיפיי אין קבצי שמע מקדימים (Preview) לפלייליסט הזה. נסה פלייליסט אחר.', 'error', 6000);
                    return false;
                }
                
                return true;
            } catch (err) {
                // מציג את השגיאה המפורטת על המסך!
                showMessage(err.message, 'error', 7000);
                return false;
            }
        }

        function playTrack() {
            if (!currentTrack || !currentTrack.preview_url) return;
            audioPlayer.play().then(() => {
                isPlaying = true;
                document.getElementById('play-icon').className = 'fa-solid fa-pause ml-0';
            }).catch(e => {
                showMessage('שגיאה בהפעלת השמע בדפדפן', 'error');
            });
        }

        function pauseTrack() {
            audioPlayer.pause();
            isPlaying = false;
            document.getElementById('play-icon').className = 'fa-solid fa-play ml-2';
        }

        function loadNextTrack() {
            if (tracks.length === 0) {
                showMessage('סיימתם את כל השירים!', 'success');
                return;
            }

            document.getElementById('music-card').classList.remove('card-flipped');
            pauseTrack();

            currentTrack = tracks.pop();
            
            audioPlayer.src = currentTrack.preview_url;
            
            document.getElementById('track-year').textContent = currentTrack.year;
            document.getElementById('track-title').textContent = currentTrack.title;
            document.getElementById('track-artist').textContent = currentTrack.artist;
            document.getElementById('album-cover').style.backgroundImage = `url('${currentTrack.cover}')`;
        }

        // --- Controls Listeners ---
        document.getElementById('play-pause-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!currentTrack) return;
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        document.getElementById('reveal-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('music-card').classList.add('card-flipped');
        });

        document.getElementById('next-track-btn').addEventListener('click', () => {
            pauseTrack();
            loadNextTrack();
        });

        document.getElementById('btn-correct').addEventListener('click', () => {
            score++;
            document.getElementById('score-count').textContent = score;
            pauseTrack();
            loadNextTrack();
        });

        document.getElementById('btn-wrong').addEventListener('click', () => {
            pauseTrack();
            loadNextTrack();
        });

        document.getElementById('btn-change-playlist').addEventListener('click', () => {
            pauseTrack();
            switchScreen('setup-screen');
        });
    </script>
</body>
</html>
