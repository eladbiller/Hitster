<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היטסטר - Spotify Remote v3.0.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap');
        body { font-family: 'Rubik', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; }
        .spotify-green { background-color: #1DB954; }
        .spotify-green:hover { background-color: #1ed760; }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        select option { background: #1e293b; color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-md pointer-events-none"></div>

    <!-- Header -->
    <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 text-center sticky top-0 z-50 shadow-md flex items-center justify-center gap-2">
        <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-200">
            <i class="fa-solid fa-gamepad mr-2 text-green-400"></i> HITSTER REMOTE
        </h1>
        <span class="text-xs bg-indigo-500/20 text-indigo-300 font-mono px-2.5 py-1 rounded-full border border-indigo-500/30">v3.0.0</span>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-md flex flex-col items-center justify-center">

        <!-- STEP 1: Login Screen -->
        <section id="login-screen" class="w-full hidden bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-6">
            <div class="space-y-2">
                <div class="w-20 h-20 bg-green-500/10 text-green-400 rounded-full flex items-center justify-center mx-auto text-4xl mb-4"><i class="fa-brands fa-spotify"></i></div>
                <h2 class="text-2xl font-bold">התחברות לספוטיפיי</h2>
                <p class="text-sm text-slate-400">התחבר כדי לשלוט במוזיקה דרך הטלפון.</p>
            </div>
            <button id="btn-login-spotify" class="w-full spotify-green text-slate-950 font-bold py-4 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-bolt"></i> התחבר ל-Spotify
            </button>
        </section>

        <!-- STEP 2: Choose Playlist -->
        <section id="setup-screen" class="w-full hidden bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-5">
            <div id="user-info-badge" class="bg-slate-900/80 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-300 flex items-center justify-between">
                <span><i class="fa-solid fa-user text-green-400 ml-1"></i> מחובר כ:</span>
                <span id="user-email-display" class="font-mono text-green-300 font-bold truncate max-w-[180px]">טוען...</span>
            </div>

            <h2 class="text-xl font-bold text-green-400">בחר מאגר למשחק</h2>

            <select id="playlist-dropdown" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 text-right appearance-none">
                <option value="">טוען המידע...</option>
            </select>
            
            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-700"></div><span class="flex-shrink-0 mx-4 text-slate-500 text-xs">או</span><div class="flex-grow border-t border-slate-700"></div>
            </div>

            <input type="text" id="custom-playlist-input" placeholder="הדבק קישור לפלייליסט..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 dir-ltr text-center font-mono">

            <button id="btn-start-game" class="w-full spotify-green text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition mt-4 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> התחל משחק מקומי!
            </button>
            <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 underline font-bold pt-2 block mx-auto">התנתק והחלף חשבון</button>
        </section>

        <!-- STEP 3: Game Screen -->
        <section id="game-screen" class="w-full hidden flex-col items-center space-y-6">
            
            <div class="w-full flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 shadow-md">
                <div class="flex items-center gap-2">
                    <div class="bg-yellow-500/20 w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-trophy text-yellow-400 text-sm"></i>
                    </div>
                    <span class="text-sm text-slate-300">ניקוד:</span>
                    <span id="score-count" class="font-bold text-xl text-white">0</span>
                </div>
                <div class="flex gap-2">
                    <button id="btn-change-playlist" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 px-3 rounded-lg transition shadow-lg">
                        <i class="fa-solid fa-list"></i> חזור
                    </button>
                    <button id="next-track-btn" class="bg-indigo-600 hover:bg-indigo-500 text-sm font-bold py-2 px-4 rounded-lg transition shadow-lg flex items-center gap-2">
                        הבא <i class="fa-solid fa-forward"></i>
                    </button>
                </div>
            </div>

            <!-- THE CARD -->
            <div id="music-card" class="card-flip w-full max-w-sm mx-auto relative h-[380px]">
                <div class="card-inner relative w-full h-full rounded-3xl shadow-2xl border border-slate-700">
                    <div class="card-front absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-indigo-500/30">
                        <div class="w-full flex justify-between text-slate-400 text-sm font-medium mb-4">
                            <span><i class="fa-solid fa-music mr-1"></i> כרטיס חידה</span>
                            <i class="fa-solid fa-question-circle text-indigo-400"></i>
                        </div>
                        <div class="w-full flex-grow flex flex-col items-center justify-center gap-4 relative">
                            <button id="play-pause-btn" class="w-28 h-28 spotify-green text-slate-950 rounded-full flex items-center justify-center text-5xl shadow-[0_0_40px_rgba(29,185,84,0.4)] hover:scale-105 active:scale-95 transition">
                                <i class="fa-solid fa-play ml-2" id="play-icon"></i>
                            </button>
                        </div>
                        <button id="reveal-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition text-base flex items-center justify-center gap-2 shadow-lg border border-slate-600 mt-4">
                            <i class="fa-solid fa-eye"></i> חשוף תשובה
                        </button>
                    </div>

                    <div class="card-back absolute inset-0 bg-slate-900 rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-green-500">
                        <div id="album-cover" class="w-32 h-32 bg-slate-800 rounded-2xl shadow-xl bg-cover bg-center mb-2 border border-slate-700"></div>
                        <div class="text-center space-y-1 w-full">
                            <div id="track-year" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300">----</div>
                            <div id="track-title" class="font-bold text-xl text-white truncate w-full px-2 mt-2">שם השיר</div>
                            <div id="track-artist" class="text-base text-slate-400 truncate w-full px-2">שם האמן</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="w-full flex justify-center items-center gap-3">
                <button id="btn-wrong" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-3 px-6 rounded-xl text-sm border border-red-500/30 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-xmark"></i> טעות
                </button>
                <button id="btn-correct" class="bg-green-500/10 hover:bg-green-500/20 text-green-400 font-bold py-3 px-6 rounded-xl text-sm border border-green-500/30 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-check"></i> צדקתי (+1)
                </button>
            </div>
            
            <!-- Radar Loading -->
            <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-md z-[60] flex flex-col items-center justify-center rounded-xl p-6 text-center space-y-4">
                <i class="fa-solid fa-radar fa-spin text-5xl text-green-500 mb-2"></i>
                <h3 class="text-white font-bold text-xl">מכין משחק...</h3>
                <div id="wake-spotify-box" class="hidden w-full space-y-3 pt-2">
                    <div class="bg-slate-800 p-4 rounded-xl text-right">
                        <p class="text-sm text-slate-200 font-bold mb-2">ספוטיפיי ישנה ברקע!</p>
                        <p class="text-xs text-slate-400 mb-1">פתח אותה, נגן שיר לשנייה וחזור.</p>
                    </div>
                    <button id="btn-skip-radar" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg border border-slate-600 transition text-sm">
                        דלג והתחל בכוח
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- UI TOOLS ---
        function showMessage(msg, type = 'error', duration = 8000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600 border-red-500' : 'bg-emerald-600 border-emerald-500';
            toast.className = `${bgColor} border text-white px-5 py-4 rounded-xl shadow-2xl text-xs font-semibold flex items-start gap-3 transition-all duration-300 break-all`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-lg mt-0.5"></i> <div class="flex-1" style="line-height: 1.4;">${msg}</div>`;
            container.appendChild(toast);
            requestAnimationFrame(() => { toast.classList.remove('translate-y-[-20px]', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); });
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-20px]', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, duration);
        }

        function switchScreen(id) {
            ['login-screen', 'setup-screen', 'game-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'game-screen') document.getElementById(id).classList.add('flex');
        }

        // --- GLOBAL STATE ---
        const CLIENT_ID = 'bc721809b5344694abc164c34249aea1'; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let accessToken = localStorage.getItem('spotify_token') || null;
        let tracks = [], score = 0, isPlaying = false, activeDeviceId = null, radarInterval = null, currentTrack = null;

        // --- SPOTIFY OAUTH ---
        const generateRandomString = (l) => crypto.getRandomValues(new Uint8Array(l)).reduce((a, x) => a + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[x % 62], "");
        const sha256 = async (p) => window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
        const base64encode = (i) => btoa(String.fromCharCode(...new Uint8Array(i))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                try {
                    const res = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: localStorage.getItem('code_verifier') }),
                    });
                    const data = await res.json();
                    if (data.access_token) {
                        accessToken = data.access_token;
                        localStorage.setItem('spotify_token', accessToken);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        loadSetupScreen();
                    }
                } catch (e) {}
            } else if (accessToken) {
                loadSetupScreen();
            } else {
                switchScreen('login-screen');
            }
        });

        document.getElementById('btn-login-spotify').addEventListener('click', async () => {
            localStorage.clear();
            const codeVerifier = generateRandomString(64);
            localStorage.setItem('code_verifier', codeVerifier);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const scopes = 'user-read-email user-read-private playlist-read-private playlist-read-collaborative user-read-playback-state user-modify-playback-state user-library-read';
            const params = new URLSearchParams({ response_type: 'code', client_id: CLIENT_ID, scope: scopes, code_challenge_method: 'S256', code_challenge: codeChallenge, redirect_uri: REDIRECT_URI, show_dialog: 'true' });
            window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
        });

        function logoutAndReset() { localStorage.clear(); accessToken = null; switchScreen('login-screen'); }
        document.getElementById('btn-logout').addEventListener('click', () => { logoutAndReset(); showMessage('נמחק מידע מקומי. התחבר מחדש.', 'success'); });

        async function loadSetupScreen() {
            switchScreen('setup-screen');
            const dropdown = document.getElementById('playlist-dropdown');
            try {
                const userRes = await fetch('https://api.spotify.com/v1/me', { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (!userRes.ok) { logoutAndReset(); return; }
                document.getElementById('user-email-display').textContent = (await userRes.json()).email || 'מחובר';

                const plRes = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (!plRes.ok) return;
                const plData = await plRes.json();

                dropdown.innerHTML = '<option value="">-- בחר מאגר שירים מהרשימה --</option>';
                dropdown.innerHTML += '<option value="LIKED_SONGS" class="font-bold text-green-400">❤️ שירי המועדפים שלי (Liked Songs)</option>';

                if (plData.items) {
                    plData.items.forEach(pl => {
                        if (!pl) return;
                        dropdown.innerHTML += `<option value="${pl.id}">${pl.name} (${pl.tracks?.total||0} שירים) - יוצר: ${pl.owner?.display_name||'Unknown'}</option>`;
                    });
                }
            } catch (err) {}
        }

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            const dropdownVal = document.getElementById('playlist-dropdown').value;
            const customVal = document.getElementById('custom-playlist-input').value;
            let finalId = null;

            if (customVal && customVal.trim() !== '') {
                const m = customVal.match(/(?:playlist\/|playlist:)([a-zA-Z0-9]{22})/);
                finalId = m ? m[1] : (/^[a-zA-Z0-9]{22}$/.test(customVal) ? customVal : null);
            } else if (dropdownVal) { finalId = dropdownVal; }

            if (!finalId) { showMessage('בחר פלייליסט', 'error'); return; }
            
            switchScreen('game-screen');
            const overlay = document.getElementById('loading-overlay');
            const wakeBox = document.getElementById('wake-spotify-box');
            overlay.classList.remove('hidden'); wakeBox.classList.add('hidden');
            
            const success = await fetchPlaylistTracks(finalId);
            if (!success) { switchScreen('setup-screen'); return; }

            startDeviceRadar();
        });

        async function fetchPlaylistTracks(playlistId) {
            try {
                let rawItems = [];
                
                if (playlistId === 'LIKED_SONGS') {
                    // Fetch Liked Songs
                    const res = await fetch(`https://api.spotify.com/v1/me/tracks?limit=50&market=from_token`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                    if(!res.ok) throw new Error(await res.text());
                    rawItems = (await res.json()).items || [];
                } else {
                    // Try the specific tracks endpoint first, with market=from_token to bypass region blocks
                    let res = await fetch(`https://api.spotify.com/v1/playlists/${encodeURIComponent(playlistId)}/tracks?limit=100&market=from_token`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                    
                    if (!res.ok) {
                        // Fallback to the main playlist endpoint if tracks endpoint throws 403 Forbidden
                        res = await fetch(`https://api.spotify.com/v1/playlists/${encodeURIComponent(playlistId)}?market=from_token`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                        if(!res.ok) {
                            const errText = await res.text();
                            showMessage(`שגיאת הרשאות ספוטיפיי לפלייליסט הזה. הקוד: ${res.status}`, 'error', 10000);
                            console.error(errText);
                            return false;
                        }
                        const data = await res.json();
                        rawItems = data.tracks?.items || [];
                    } else {
                        rawItems = (await res.json()).items || [];
                    }
                }

                if (rawItems.length === 0) { showMessage('המאגר ריק או חסום.', 'error'); return false; }

                tracks = rawItems
                    .filter(i => i?.track?.uri && i?.track?.album?.release_date && !i.track.is_local)
                    .map(i => ({
                        uri: i.track.uri, title: i.track.name,
                        artist: i.track.artists ? i.track.artists.map(a => a.name).join(', ') : 'Unknown',
                        year: i.track.album.release_date.substring(0, 4), cover: i.track.album.images?.[0]?.url || ''
                    })).sort(() => Math.random() - 0.5);

                if (tracks.length === 0) { showMessage('לא נמצאו שירים עם תאריך במאגר זה.', 'error'); return false; }
                return true;
            } catch (err) { 
                showMessage(`תקלת תקשורת: ${err.message}`, 'error'); 
                return false; 
            }
        }

        // --- SPOTIFY PLAYBACK ---
        async function startDeviceRadar() {
            const overlay = document.getElementById('loading-overlay');
            const wakeBox = document.getElementById('wake-spotify-box');
            
            const check = async () => {
                try {
                    const res = await fetch('https://api.spotify.com/v1/me/player/devices', { headers: { 'Authorization': `Bearer ${accessToken}` } });
                    const data = await res.json();
                    if (data.devices?.length > 0) {
                        activeDeviceId = (data.devices.find(d => d.is_active) || data.devices[0]).id;
                        clearInterval(radarInterval); overlay.classList.add('hidden');
                        loadNextTrack();
                        showMessage('ספוטיפיי מחובר!', 'success', 3000);
                        return true;
                    }
                    return false;
                } catch(e) { return false; }
            };
            
            if (!(await check())) { wakeBox.classList.remove('hidden'); radarInterval = setInterval(check, 2500); }
        }

        document.getElementById('btn-skip-radar').addEventListener('click', () => {
            clearInterval(radarInterval); document.getElementById('loading-overlay').classList.add('hidden');
            loadNextTrack();
            showMessage('דילגנו על החיפוש. נסה ללחוץ Play.', 'success');
        });

        async function playTrack(uri) {
            try {
                let url = 'https://api.spotify.com/v1/me/player/play' + (activeDeviceId ? `?device_id=${activeDeviceId}` : '');
                await fetch(url, { method: 'PUT', body: JSON.stringify({ uris: [uri] }), headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` } });
                isPlaying = true; document.getElementById('play-icon').className = 'fa-solid fa-pause ml-0';
            } catch(e) {}
        }

        async function pauseTrack() {
            try {
                let url = 'https://api.spotify.com/v1/me/player/pause' + (activeDeviceId ? `?device_id=${activeDeviceId}` : '');
                await fetch(url, { method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}` } });
                isPlaying = false; document.getElementById('play-icon').className = 'fa-solid fa-play ml-2';
            } catch(e) {}
        }

        document.getElementById('play-pause-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (currentTrack) isPlaying ? pauseTrack() : playTrack(currentTrack.uri);
        });

        function loadNextTrack() {
            if (tracks.length === 0) { showMessage('סיימתם את כל השירים!', 'success'); return; }
            document.getElementById('music-card').classList.remove('card-flipped');
            isPlaying = false; document.getElementById('play-icon').className = 'fa-solid fa-play ml-2';
            currentTrack = tracks.pop();
            document.getElementById('track-year').textContent = currentTrack.year;
            document.getElementById('track-title').textContent = currentTrack.title;
            document.getElementById('track-artist').textContent = currentTrack.artist;
            document.getElementById('album-cover').style.backgroundImage = `url('${currentTrack.cover}')`;
        }

        document.getElementById('next-track-btn').addEventListener('click', () => { pauseTrack(); loadNextTrack(); });
        document.getElementById('reveal-btn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('music-card').classList.add('card-flipped'); });
        
        document.getElementById('btn-correct').addEventListener('click', () => { score++; document.getElementById('score-count').textContent = score; pauseTrack(); loadNextTrack(); });
        document.getElementById('btn-wrong').addEventListener('click', () => { pauseTrack(); loadNextTrack(); });
        document.getElementById('btn-change-playlist').addEventListener('click', () => { pauseTrack(); if(radarInterval) clearInterval(radarInterval); switchScreen('setup-screen'); });
    </script>
</body>
</html>
