<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היטסטר אישי - Hitster Spotify Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap');
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .spotify-green { background-color: #1DB954; }
        .spotify-green:hover { background-color: #1ed760; }
        .card-flip { perspective: 1000px; }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 text-center sticky top-0 z-50 shadow-md">
        <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-200">
            <i class="fa-solid fa-record-vinyl mr-2 text-green-400"></i> HITSTER MY PLAYLIST
        </h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-md flex flex-col items-center justify-center">

        <!-- STEP 1: Spotify Login & Setup -->
        <section id="setup-screen" class="w-full bg-slate-800/90 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center space-y-6">
            <div class="space-y-2">
                <div class="w-16 h-16 bg-green-500/10 text-green-400 rounded-full flex items-center justify-center mx-auto text-3xl mb-4">
                    <i class="fa-brands fa-spotify"></i>
                </div>
                <h2 class="text-xl font-bold">התחברות ל-Spotify</h2>
                <p class="text-sm text-slate-400">הכנס את קישור הפלייליסט שלך והתחל</p>
            </div>

            <div class="space-y-4 text-right">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Spotify Client ID (מוגדר מראש)</label>
                    <input type="text" id="client-id-input" value="bc721809b5344694abc164c34249aea1" readonly 
                        class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl p-3 text-sm focus:outline-none dir-ltr text-center font-mono text-slate-500 cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">קישור לפלייליסט בספוטיפיי</label>
                    <input type="text" id="playlist-url-input" placeholder="https://open.spotify.com/playlist/..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 dir-ltr text-center font-mono">
                </div>
            </div>

            <button id="login-btn" class="w-full spotify-green text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> התחל משחק!
            </button>
            
            <p class="text-xs text-slate-500 bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                <i class="fa-solid fa-circle-info text-blue-400 mr-1"></i>
                נדרש חשבון Spotify Premium לניגון באפליקציות צד-שלישי.
            </p>
        </section>

        <!-- STEP 2: Game Screen -->
        <section id="game-screen" class="w-full hidden flex-col items-center space-y-6">

            <div class="w-full flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 shadow-md">
                <div class="flex items-center gap-2">
                    <div class="bg-yellow-500/20 w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-trophy text-yellow-400 text-sm"></i>
                    </div>
                    <span class="text-sm text-slate-300">ניקוד:</span>
                    <span id="score-count" class="font-bold text-xl text-white">0</span>
                </div>
                <button id="next-track-btn" class="bg-indigo-600 hover:bg-indigo-500 text-sm font-bold py-2 px-4 rounded-lg transition shadow-lg flex items-center gap-2">
                    שיר הבא <i class="fa-solid fa-forward"></i>
                </button>
            </div>

            <div id="music-card" class="card-flip w-full h-80 cursor-pointer w-full max-w-sm mx-auto">
                <div class="card-inner relative w-full h-full rounded-3xl shadow-2xl border border-slate-700">
                    
                    <div class="card-front absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-indigo-500/30">
                        <div class="w-full flex justify-between text-slate-400 text-sm font-medium">
                            <span><i class="fa-solid fa-music mr-1"></i> כרטיס חידה</span>
                            <i class="fa-solid fa-question-circle text-indigo-400"></i>
                        </div>

                        <div class="flex flex-col items-center space-y-4 my-auto">
                            <button id="play-pause-btn" class="w-24 h-24 spotify-green text-slate-950 rounded-full flex items-center justify-center text-4xl shadow-[0_0_30px_rgba(29,185,84,0.3)] hover:scale-105 active:scale-95 transition">
                                <i class="fa-solid fa-play ml-2" id="play-icon"></i>
                            </button>
                            <span class="text-sm text-slate-400 font-medium tracking-wide">לחץ להשמעה</span>
                        </div>

                        <button id="reveal-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition text-base flex items-center justify-center gap-2 shadow-lg border border-slate-600">
                            <i class="fa-solid fa-eye"></i> חשוף תשובה
                        </button>
                    </div>

                    <div class="card-back absolute inset-0 bg-slate-900 rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-green-500 shadow-[0_0_30px_rgba(29,185,84,0.1)]">
                        <div id="album-cover" class="w-32 h-32 bg-slate-800 rounded-2xl shadow-xl bg-cover bg-center mb-2 border border-slate-700"></div>

                        <div class="text-center space-y-1 w-full">
                            <div id="track-year" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300 drop-shadow-sm">
                                1985
                            </div>
                            <div id="track-title" class="font-bold text-xl text-white truncate w-full px-2 mt-2">
                                שם השיר
                            </div>
                            <div id="track-artist" class="text-base text-slate-400 truncate w-full px-2">
                                שם האמן
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 w-full mt-4">
                            <button id="btn-wrong" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-3 rounded-xl text-sm border border-red-500/30 transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-xmark"></i> טעות
                            </button>
                            <button id="btn-correct" class="bg-green-500/10 hover:bg-green-500/20 text-green-400 font-bold py-3 rounded-xl text-sm border border-green-500/30 transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-check"></i> צודק (+1)
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-900/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center rounded-xl">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-green-500 mb-4"></i>
                <p class="text-white font-medium">טוען שיר...</p>
            </div>

        </section>

    </main>

    <script>
        function showMessage(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500/90 border-red-600' : 'bg-green-500/90 border-green-600';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
            
            toast.className = `${bgColor} border backdrop-blur text-white px-5 py-4 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-[-20px] opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        let accessToken = null;
        let player = null;
        let deviceId = null;
        let tracks = [];
        let currentTrack = null;
        let score = 0;
        let isPlaying = false;

        // Force exactly the current URL as the redirect
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const CLIENT_ID = 'bc721809b5344694abc164c34249aea1';

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const loginBtn = document.getElementById('login-btn');
        const playlistUrlInput = document.getElementById('playlist-url-input');

        const musicCard = document.getElementById('music-card');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const revealBtn = document.getElementById('reveal-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        const trackYear = document.getElementById('track-year');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const albumCover = document.getElementById('album-cover');
        const scoreCount = document.getElementById('score-count');

        const nextTrackBtn = document.getElementById('next-track-btn');
        const btnCorrect = document.getElementById('btn-correct');
        const btnWrong = document.getElementById('btn-wrong');

        // --- PKCE Auth Methods ---
        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        };

        // --- Check for code on load ---
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                // Exchange code for access token
                const codeVerifier = localStorage.getItem('code_verifier');
                
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            client_id: CLIENT_ID,
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: REDIRECT_URI,
                            code_verifier: codeVerifier,
                        }),
                    });

                    const data = await response.json();
                    
                    if (data.access_token) {
                        accessToken = data.access_token;
                        
                        // Clean up the URL
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        const savedPlaylist = localStorage.getItem('hitster_playlist_id');
                        if (savedPlaylist) {
                            initGame(savedPlaylist);
                        }
                    } else {
                        showMessage('שגיאה בקבלת ההרשאה', 'error');
                    }
                } catch (error) {
                    showMessage('ההתחברות נכשלה', 'error');
                }
            }
        });

        loginBtn.addEventListener('click', async () => {
            const playlistUrl = playlistUrlInput.value.trim();
            const playlistId = extractPlaylistId(playlistUrl);
            
            if (!playlistId) {
                showMessage('קישור לפלייליסט לא תקין', 'error');
                return;
            }

            localStorage.setItem('hitster_playlist_id', playlistId);

            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const scopes = [
                'streaming',
                'user-read-email',
                'user-read-private',
                'user-modify-playback-state'
            ];

            const authUrl = new URL("https://accounts.spotify.com/authorize");
            const params = {
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: scopes.join(' '),
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: REDIRECT_URI,
            };

            authUrl.search = new URLSearchParams(params).toString();
            window.location.href = authUrl.toString();
        });

        function extractPlaylistId(url) {
            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/');
                const playlistIndex = pathParts.indexOf('playlist');
                if (playlistIndex !== -1 && pathParts.length > playlistIndex + 1) {
                    return pathParts[playlistIndex + 1].split('?')[0];
                }
                return null;
            } catch (e) {
                const match = url.match(/playlist\/([a-zA-Z0-9]+)/);
                return match ? match[1] : null;
            }
        }

        async function initGame(playlistId) {
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            loadingOverlay.classList.remove('hidden');
            
            const success = await fetchPlaylistTracks(playlistId);
            if (success) {
                initSpotifyPlayer();
            } else {
                loadingOverlay.classList.add('hidden');
            }
        }

        async function fetchPlaylistTracks(playlistId) {
            try {
                const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=100`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                if (!response.ok) throw new Error('Failed to fetch playlist');

                const data = await response.json();
                
                tracks = data.items
                    .filter(item => item.track && item.track.album.release_date && item.track.preview_url === null && item.track.is_local === false)
                    .map(item => ({
                        uri: item.track.uri,
                        title: item.track.name,
                        artist: item.track.artists.map(a => a.name).join(', '),
                        year: item.track.album.release_date.substring(0, 4),
                        cover: item.track.album.images[0]?.url || ''
                    }));

                tracks.sort(() => Math.random() - 0.5);
                
                if (tracks.length === 0) {
                    showMessage('לא נמצאו שירים זמינים', 'error');
                    return false;
                }
                
                return true;
            } catch (err) {
                showMessage('שגיאה בטעינת הפלייליסט', 'error');
                return false;
            }
        }

        function initSpotifyPlayer() {
            window.onSpotifyWebPlaybackSDKReady = () => {
                player = new Spotify.Player({
                    name: 'Hitster Web Player',
                    getOAuthToken: cb => { cb(accessToken); },
                    volume: 0.8
                });

                player.addListener('ready', ({ device_id }) => {
                    deviceId = device_id;
                    loadingOverlay.classList.add('hidden');
                    loadNextTrack();
                    showMessage('מחובר ל-Spotify בהצלחה!', 'success');
                });

                player.addListener('player_state_changed', state => {
                    if (!state) return;
                    isPlaying = !state.paused;
                    playIcon.className = isPlaying ? 'fa-solid fa-pause ml-0' : 'fa-solid fa-play ml-2';
                });

                player.connect();
            };
        }

        async function playTrack(uri) {
            if (!deviceId) return;
            try {
                await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ uris: [uri] }),
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
            } catch(e) {
                showMessage('שגיאה בהפעלת השיר.', 'error');
            }
        }

        function loadNextTrack() {
            if (tracks.length === 0) {
                showMessage('סיימתם את כל השירים בפלייליסט!', 'success');
                return;
            }

            musicCard.classList.remove('card-flipped');
            isPlaying = false;
            playIcon.className = 'fa-solid fa-play ml-2';

            currentTrack = tracks.pop();

            trackYear.textContent = currentTrack.year;
            trackTitle.textContent = currentTrack.title;
            trackArtist.textContent = currentTrack.artist;
            albumCover.style.backgroundImage = `url('${currentTrack.cover}')`;
        }

        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!currentTrack) return;
            isPlaying ? player.pause() : playTrack(currentTrack.uri);
        });

        revealBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            musicCard.classList.add('card-flipped');
        });

        nextTrackBtn.addEventListener('click', () => {
            if (player) player.pause();
            loadNextTrack();
        });

        btnCorrect.addEventListener('click', () => {
            score++;
            scoreCount.textContent = score;
            if (player) player.pause();
            loadNextTrack();
        });

        btnWrong.addEventListener('click', () => {
            if (player) player.pause();
            loadNextTrack();
        });
    </script>
</body>
</html>
